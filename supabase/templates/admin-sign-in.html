<!doctype html>
<html lang="en" style="margin:0;padding:0;background:#f7f4ee;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body style="margin:0;padding:0;background:#f7f4ee;color:#1c1a17;font-family:Georgia,'Times New Roman',serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:0;padding:0;background:#f7f4ee;">
      <tr>
        <td align="center" style="padding:32px 16px 40px;">
          <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;"><tr><td><![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;margin:0 auto;background:#fcfaf6;">
            <tr>
              <td style="padding:28px 32px 24px;border-bottom:1px solid #ddd6c8;">
                <p style="margin:0;color:#1c1a17;font-family:'Trebuchet MS',sans-serif;font-size:13px;line-height:18px;letter-spacing:2px;font-weight:bold;">THE SOLAS GUIDE</p>
              </td>
            </tr>
            <tr>
              <td style="padding:44px 32px 40px;">
                <p style="margin:0 0 14px;color:#2e4238;font-family:'Trebuchet MS',sans-serif;font-size:12px;line-height:17px;letter-spacing:1.8px;font-weight:bold;text-transform:uppercase;">Admin access</p>
                <h1 style="margin:0 0 18px;color:#1c1a17;font-size:34px;line-height:40px;font-weight:normal;letter-spacing:-0.4px;">Your sign-in code</h1>
                <p style="margin:0 0 28px;color:#1c1a17;font-size:17px;line-height:27px;">Use this six-digit code to sign in to the Solas Admin Portal.</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:0 0 28px;background:#f7f4ee;border-left:4px solid #2e4238;">
                  <tr>
                    <td align="center" style="padding:24px 16px 22px;">
                      <p style="margin:0;color:#1c1a17;font-family:'Trebuchet MS',sans-serif;font-size:12px;line-height:18px;letter-spacing:1.6px;font-weight:bold;text-transform:uppercase;">Verification code</p>
                      <p style="margin:10px 0 0;color:#1c1a17;font-family:'Courier New',Courier,monospace;font-size:36px;line-height:44px;letter-spacing:9px;font-weight:bold;">{{ .Token }}</p>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 12px;color:#1c1a17;font-size:15px;line-height:23px;">This code expires in ten minutes.</p>
                <p style="margin:0;color:#6e675c;font-size:14px;line-height:22px;">If you did not request this code, you can ignore this email.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 24px;border-top:1px solid #ddd6c8;">
                <p style="margin:0;color:#6e675c;font-family:'Trebuchet MS',sans-serif;font-size:12px;line-height:18px;">The Solas Guide · Admin Portal</p>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
