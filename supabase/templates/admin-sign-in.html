<!doctype html>
<html lang="en" style="margin:0;padding:0;background:#f3eee6;">
  <body style="margin:0;padding:0;background:#f3eee6;color:#20251f;font-family:Georgia,'Times New Roman',serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:0;padding:0;background:#f3eee6;">
      <tr>
        <td align="center" style="padding:32px 16px 40px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;margin:0 auto;background:#fffdf9;">
            <tr>
              <td style="padding:28px 32px 24px;border-bottom:1px solid #d9d2c7;">
                <p style="margin:0;color:#20251f;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;letter-spacing:2px;font-weight:bold;">THE SOLAS GUIDE</p>
              </td>
            </tr>
            <tr>
              <td style="padding:44px 32px 40px;">
                <p style="margin:0 0 14px;color:#67715f;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:17px;letter-spacing:1.8px;font-weight:bold;text-transform:uppercase;">Admin access</p>
                <h1 style="margin:0 0 18px;color:#20251f;font-size:34px;line-height:40px;font-weight:normal;letter-spacing:-0.4px;">Your sign-in code</h1>
                <p style="margin:0 0 28px;color:#4d534b;font-size:17px;line-height:27px;">Use this six-digit code to sign in to the Solas Admin Portal.</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:0 0 28px;background:#f3eee6;border-left:4px solid #c77752;">
                  <tr>
                    <td align="center" style="padding:24px 16px 22px;">
                      <p style="margin:0;color:#20251f;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;letter-spacing:1.6px;font-weight:bold;text-transform:uppercase;">Verification code</p>
                      <p style="margin:10px 0 0;color:#20251f;font-family:Arial,Helvetica,sans-serif;font-size:36px;line-height:44px;letter-spacing:9px;font-weight:bold;">{{ .Token }}</p>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 12px;color:#4d534b;font-size:15px;line-height:23px;">This code expires in ten minutes.</p>
                <p style="margin:0;color:#697067;font-size:14px;line-height:22px;">If you did not request this code, you can ignore this email.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 24px;border-top:1px solid #d9d2c7;">
                <p style="margin:0;color:#697067;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;">The Solas Guide · Admin Portal</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
